name: Build APK
on: { push: { branches: [main] }, workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.8.1' }
      - name: Unit tests + APK
        id: build
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          set -o pipefail
          gradle :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Publish the build log (and the APK) on the build-output branch
        if: always()
        run: |
          OUT=$(mktemp -d); cp build.log $OUT/ 2>/dev/null || echo "no log" > $OUT/build.log
          find app/build/test-results -name '*.xml' -exec cp {} $OUT/ \; 2>/dev/null || true
          cp app/build/outputs/apk/release/app-release.apk $OUT/PUFF-PUFF.apk 2>/dev/null || true
          cd $OUT && git init -q && git checkout -q -b build-output && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "build ${{ github.run_number }}: ${{ steps.build.outcome }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" build-output
      - name: Release
        if: steps.build.outcome == 'success'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp app/build/outputs/apk/release/app-release.apk PUFF-PUFF.apk
          gh release create "build${{ github.run_number }}" PUFF-PUFF.apk --title "PUFF PUFF build ${{ github.run_number }}" --notes "PUFF PUFF pinball · AR (ARCore) and 3D" --latest
